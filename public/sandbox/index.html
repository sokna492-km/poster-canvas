<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Poster Studio preview sandbox</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
      // Default stack: Latin → IBM Plex Sans; Khmer glyphs fall through to Kantumruy Pro.
      // User code that sets font-family (style or Tailwind font-*) overrides this.
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: [
                '"Kantumruy Pro"',
                '"IBM Plex Sans"',
                "system-ui",
                "sans-serif",
              ],
            },
          },
        },
      };
    </script>
    <!-- Same-origin poster fonts (reliable html-to-image embed; see vendor/fonts/) -->
    <link rel="stylesheet" href="./vendor/fonts/poster-fonts.css" />
    <!-- KaTeX 0.18.4 (vendored; same-origin fonts for reliable export) -->
    <link rel="stylesheet" href="./vendor/katex/katex.min.css" />
    <script src="./vendor/katex/katex.min.js"></script>
    <script src="./vendor/katex/mhchem.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: "Kantumruy Pro", "IBM Plex Sans", system-ui, sans-serif;
      }
      #poster-root {
        overflow: hidden;
        position: relative;
        font-family: "Kantumruy Pro", "IBM Plex Sans", system-ui, sans-serif;
        font-synthesis: none;
      }
      #fallback {
        font:
          14px ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          monospace;
        color: #a1a1aa;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div id="poster-root"><div id="fallback">Loading sandbox…</div></div>
    <script type="module" src="./main.js?v=7"></script>
  </body>
</html>
